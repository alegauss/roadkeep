version: 2

updates:
  # npm workspaces: the root manifest covers packages/core, packages/ui and
  # packages/shell, so a single entry is enough.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # A dependency lands in the first group whose patterns match it, so the
    # catch-all stays last.
    groups:
      electron:
        patterns:
          - electron
          - electron-*
          - '@electron/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/react'
          - '@vitejs/plugin-react'
      vite:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - jsdom
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      typescript:
        patterns:
          - typescript
          - '@types/node'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The workflows themselves, now that there is one to update — RG55 wrote it and RG95
  # noticed this note had come due. Declared before a workflow existed, the job aborts with
  # dependency_file_not_found: /action.yml or /.github/workflows/<anything>.yml.
  #
  # A pinned action goes stale the way a pinned package does, and these run with the
  # repository checked out beside them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
