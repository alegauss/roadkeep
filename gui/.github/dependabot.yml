version: 2

updates:
  # npm workspaces: the root manifest covers packages/core, packages/ui and
  # packages/shell, so a single entry is enough.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # A dependency lands in the first group whose patterns match it, so the
    # catch-all stays last.
    groups:
      electron:
        patterns:
          - electron
          - electron-*
          - '@electron/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/react'
          - '@vitejs/plugin-react'
      vite:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - jsdom
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      typescript:
        patterns:
          - typescript
          - '@types/node'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # A github-actions entry goes here once .github/workflows/ has its first
  # workflow. Declared before that, the job aborts with
  # dependency_file_not_found: /action.yml or /.github/workflows/<anything>.yml.
