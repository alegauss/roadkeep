# Where the promises are actually kept (RG55).
#
# Every assertion this plan rests on is a command a person can run: `npm run typecheck`,
# `npm test`, `npm run build`, `roadkeep lint`. None of them is defined here — this file
# only refuses to forget them, which is the whole of what CI is for.
#
# The last of them runs beside this file rather than in it: `roadkeep.yml` is what
# `roadkeep install` writes, and it is the gate (RG120).
name: ci

on:
  push:
    branches: [main]
    # A tag is what asks for an installer (RG91). The suite runs on every change, and so
    # does the gate beside it; the package job below runs only here and on demand, because
    # an installer per platform per push is runner minutes spent on an artefact nobody
    # downloads.
    tags: ['v*']
  pull_request:
  # The other way to ask for one, and the way somebody gets a build to try without a
  # developer machine.
  workflow_dispatch:

# A push that supersedes a run makes the earlier one an answer about code nobody has.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Where the engine is checked out to, named once because two jobs and one launcher all
  # have to agree on it.
  #
  # It is another repository landing at the workspace root, and that root is where
  # `npm run lint` starts walking — so `.gitignore`, `.oxlintrc.json` and `.prettierignore`
  # each name this directory, and the gate goes on judging only what this project wrote
  # (RG111). Checking out somewhere already ignored would save those three lines, and
  # `.roadkeep/` is the candidate that suggests itself; roadkeep refuses a `.roadkeep/`
  # carrying a `.git` as a source, so that trades a red lint for a red `engines` row.
  ROADKEEP_CHECKOUT: roadkeep

# The gate is not here any more (RG120). `roadkeep install` writes
# `.github/workflows/roadkeep.yml`, which is this same job — a checkout and the action —
# and a second copy would run one lint twice on every push. What was recorded here and is
# worth keeping: the `@main` in it is deliberate, because this project tracks roadkeep's
# main (`[install] wired` in roadkeep.toml records a commit, not a release, the tool
# cutting none), so a pinned tag would gate documents written by a much later engine
# against a much earlier one. The cost is stated: that job can go red because roadkeep
# moved, and that is a thing worth being told.
#
# The two places that depended on the job say so themselves: `package` calls the action
# directly, and `suite` holds the copied surfaces against the engine it already installed.
jobs:
  suite:
    name: suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Both, and neither cancelled by the other: which platform failed is the useful half
      # of a failure in a desktop app, and `fail-fast` throws exactly that away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The engine the live tests spawn. `.claude/hooks/roadkeep-launch.py` resolves a
      # checkout and deliberately never fetches one — a hook that downloads code is a hook
      # that runs what the repository did not commit — so supplying it is CI's job.
      # `ROADKEEP_HOME` is that launcher's own first candidate, ahead of everything a
      # runner might happen to have.
      - name: check out the engine
        uses: actions/checkout@v4
        with:
          repository: alegauss/roadkeep
          path: ${{ env.ROADKEEP_CHECKOUT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # roadkeep declares no dependencies, so the interpreter is the whole install. 3.11 is
      # its floor, `tomllib` being stdlib there.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # And the same engine again, this time as a command (RG113).
      #
      # `engineCandidates` builds both of its candidates relative to the project being
      # opened: the committed launcher where that project has one, and otherwise a bare
      # `roadkeep` on PATH. A live fixture is a temporary directory with governed files in
      # it and no `.claude/`, so PATH is the only candidate it ever gets — and a runner
      # given the engine as a checkout alone has nothing there, which reads as `unresolved`
      # and fails five tests that pass wherever pip has been.
      #
      # Installed from the checkout above, so the command and `ROADKEEP_HOME` are one
      # commit. No dependencies to resolve, which is why this costs a second.
      - name: put that engine on PATH
        run: pip install ./${{ env.ROADKEEP_CHECKOUT }}
        shell: bash

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # oxlint holds the package split — a `core` that imported Electron would compile and
      # be wrong — Prettier is a check and never a write here (a step that reformatted the
      # branch it is judging would be a gate that commits), and the design system's own
      # duplicates gate fails on a component this app re-declared.
      - name: lint
        run: npm run lint

      # The other half of RG120, and the one that stops the drift coming back: the skill,
      # the guard and the launcher this repository commits are copies, and `--check` writes
      # nothing and exits non-zero on any of them that the engine would rewrite. Here rather
      # than in a job of its own because the engine is already installed two steps up, and
      # it is the same checkout the live suite spawns — so what is checked against is what
      # will answer.
      #
      # `--source` names that checkout rather than letting the command look for its own:
      # the engine is `pip install`ed here, and the surfaces it copies are repository files
      # beside the package — a plugin manifest, the skill's pages — which a wheel does not
      # carry. Without it the step fails looking for what it ships.
      #
      # It can go red on a day nobody edited a skill, roadkeep's main having moved under it.
      # That is the same cost the gate states and the same answer: run `roadkeep install`.
      - name: the wired surfaces are the engine's own
        run: roadkeep install --check --source ./${{ env.ROADKEEP_CHECKOUT }}
        shell: bash

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, and an Electron
      # installed by npm carries no SUID `chrome-sandbox` to fall back to — so Chromium cannot
      # enter its sandbox and the browser process exits before it writes the port RG60's
      # harness waits for. The window never opens and the symptom is thirty seconds of nothing
      # (RG114).
      #
      # Relaxed on the runner rather than answered with `--no-sandbox`, which is the other way
      # out and the wrong one: `running-app-live` asserts that `require`, `process` and the
      # rest are undefined *because the sandbox is on*, so a runner that switched it off would
      # report a pass about a posture nobody ships.
      - name: let Chromium enter its sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # RG60 starts the built app and asks the running window what it was given, so the bundle
      # has to exist before the suite rather than after it.
      - name: build
        run: npm run build

      # `test:all`, which is both halves (RG64). `npm test` is the fast one on purpose — no
      # process, no display, no bundle — and CI is the place that pays for the other.
      #
      # The live half has dependencies the fast one does not, and both are above: `python`
      # with the launcher this repository commits, and a build. The engine that answers is
      # not the developer's, which is the point — the contract test asserts the shape of
      # every payload and reports the version that produced it, so a second copy is a second
      # chance to catch a rename.
      #
      # A Linux runner has no desktop session, and Electron will not open a window without
      # one — `xvfb-run` is the display. Windows and macOS runners already have one.
      - name: test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm run test:all' || 'npm run test:all' }}
        shell: bash
        env:
          ROADKEEP_HOME: ${{ github.workspace }}/${{ env.ROADKEEP_CHECKOUT }}

      # The half of packaging that is worth paying for on every change (RG91).
      #
      # `npm run package` is three steps — build, stamp, electron-builder — and the refusal
      # lives in the second: it reads the posture the window is actually constructed with
      # and exits non-zero rather than shipping a renderer that gained a power. Running it
      # here costs a second and is the difference between that refusal being code and being
      # a thing one machine ran once. electron-builder is the expensive third step and is
      # the job below.
      - name: stamp, which is where packaging refuses
        run: npm run stamp

      # Advisories, against the list of the ones this project has read (RG95). It is a step
      # and not a job because it needs the install that is already here, and it is here
      # rather than in `npm run lint` because a gate over somebody else's registry can go
      # red on a morning nobody changed a line — which is a thing to be told, but not a
      # thing to discover while checking a formatting run.
      #
      # `npm audit`'s own exit code is not the answer: it is non-zero for anything at the
      # level it was given, accepted or not. The script reads the report.
      - name: advisories
        run: node packages/shell/dist/audit.js

  # The artefact somebody would actually install (RG91).
  #
  # On a tag or on demand, never on a push: an installer per platform per push is minutes
  # of runner time for something nobody downloads, and what this is for is the two cases
  # where a real build matters — cutting one, and handing one to somebody without a
  # developer machine.
  #
  # macOS is absent and that is not an oversight: no macOS build of this app has ever been
  # attempted, and a runner is the wrong place to find out what it needs. It is RG119.
  package:
    name: package on ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Nothing is packaged from a tree whose suite is red, which is the whole reason the
    # artefact is worth keeping. The gate is the other half of that and cannot be a `needs:`
    # any more — it runs in `roadkeep.yml` now, and a job cannot wait on another workflow —
    # so this job calls the action itself, below. Rare enough to cost nothing: this runs on
    # a tag or on demand and never on a push.
    needs: [suite]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # `commitOf` runs `git rev-parse` in the checkout, and a shallow clone still has
          # a HEAD — but a build whose stamp says `unstamped` is the one thing this job
          # exists to produce correctly, so the history is fetched rather than assumed.
          fetch-depth: 0

      # The version an installer says it is comes from `package.json`, through the stamp —
      # so a tag naming another one would draft a release whose files disagree with its
      # title (RG50). Refused before anything is built, which is the cheap place to be told.
      - name: the tag names the version the manifest carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          manifest=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME, but package.json says $manifest"
            exit 1
          fi

      # The gate, in the job that needs it. An installer built from a tree whose governed
      # files drifted is the one artefact worth refusing, and `needs:` cannot reach across
      # workflows to the job that would have said so.
      - uses: alegauss/roadkeep@main

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Build, stamp and electron-builder, in one command, so CI runs what a person runs
      # rather than a sequence assembled here that could drift from it.
      # The script itself carries `--publish never`, so this job keeps the artefact and
      # publishes nothing whether or not a runner happens to hand it a token. A release is
      # a decision somebody makes, not a side effect of pushing a tag.
      - name: package
        run: npm run package

      # The installer, and nothing else from `release/` — the unpacked directory beside it
      # is the same bytes again and several times the size.
      - name: keep it
        uses: actions/upload-artifact@v4
        with:
          name: roadkeep-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # The installers, on a release page somebody can find (RG50) — and **a draft**, because a
  # release is a decision somebody makes and not a side effect of pushing a tag. Publishing
  # it is one click on the page this leaves behind, and until then nothing reading
  # `releases/latest` sees it: GitHub leaves drafts out of that answer.
  #
  # Cutting one, then: set `version` in package.json, commit, push a `v<that version>` tag,
  # wait for this job, read the draft, publish it.
  release:
    name: draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job that writes to the repository, so the one that asks to.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: draft it, with both installers attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "roadkeep $GITHUB_REF_NAME" \
            --generate-notes
