prefix = "RG"

# how a rationale section is addressed: "id" derives the pointer from the
# task's own id, "outline" keeps a hand-numbered anchor
ref_scheme = "id"

# what jumps the queue, in order: an id or a "Block X", and nothing else
priority = []

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
decisions = "docs/DECISIONS.md"
deferred = "docs/DEFERRED.md"

[limits]
# characters, counted in UTF-16 code units — the stricter of the two counts, so a
# line these accept is one a gate written in Java, C# or JavaScript accepts too
symptom = 120
why = 200
line = 320

# a section is prose, so its budget is words; prose is the width one is filled to,
# counted in code points — it is a wrapping column and nothing refuses it
section = 250
prose = 88

[limits.decisions]
# a decision's body says what was weighed and what was accepted, which is narrower
# than a design: the design of how a screen was built stays in improvements
section = 150

[markers]
open = ["📋", "💭", "⏳", "🛠"]
# which of those still have their design to write. Declared because this backlog is
# executed by agents: `pick --designed` sets these aside for a caller that asked to
# build rather than to plan, and every answer says when the line it chose is one
undesigned = ["💭"]
shipped = "✅"
retired = "🗑"

[claims]
# minutes a claim on a line reads as held, before a later caller steps over it
held = 60

[budgets]
# Files loaded on every turn, and what each may cost (RG56). Held by the gate rather than
# by a sentence at the bottom of the file about itself, which is the arrangement that let a
# sibling project's instruction file reach 186 KB while declaring 150 lines.
#
# Bytes as well as lines, because a line budget is met by writing longer lines. The figures
# are the file as it shipped, with room for one real addition — a budget set far above the
# reading is room the prose grows back into.
#
# Measured *after* Prettier (RG58), which is the size a session actually pays: padding a
# Markdown table to align it cost this file 648 bytes, and a budget set on the unformatted
# prose refused a file nobody had added a word to. 59 lines, 3340 bytes formatted.
#
# `.claude/skills/roadkeep-gui-roadmap-docs/SKILL.md` is deliberately absent: it is
# trigger-loaded, so its cost falls on the turns that write, and budgeting it would price
# it as if it were resident. The index above it is what every turn pays for.
"CLAUDE.md" = { lines = 70, bytes = 3900 }

# the roadmap's other list: declared at all means governed, and `lead` and `why`
# are the two limits a bullet is held to — 80 and 320 characters unless set here
[non_goals]

# what must be **true** for a block to be finished, where the list above says what is
# not built — the same two limits, declared separately: a project may govern one list
# and not the other
[criteria]

# what has to be *present* to finish a line — hardware, an account, somebody's time.
# Not a dep: `pick` offers a line needing one only to a caller that says it has it,
# with `--have`. An undeclared word is refused.
#
# Three, and each is a thing an agent on this machine does not have. `signing-cert`
# is a certificate somebody buys; `macos-machine` is hardware no CI minute
# substitutes for, notarisation running only there; `published-artifact` is a
# release that exists on the internet, which is what an update check reads.
[requirements]
declared = ["signing-cert", "macos-machine", "published-artifact"]

[install]
wired = "0.2.366"
