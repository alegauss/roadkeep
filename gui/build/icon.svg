<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>roadkeep</title>
  <desc>roadkeep's mark on a dark tile: four task lines stopping at a gate, the fourth cut there. The app's icon (RG138), rendered to icon.png by render-icon.cjs.</desc>
  <!-- A tile, because four thin lines on nothing vanish at 16px on a light taskbar. Slate 900,
       the colour the roadkeep site sets its wordmark in. -->
  <rect width="1024" height="1024" rx="224" fill="#0f172a"/>
  <!-- The mark from roadkeep/site/public/assets/roadkeep-mark.svg, rect for rect, in the site's
       dark palette, which is the one drawn to sit on a dark ground. Scaled five times and
       centred on the content's own box (x 24-166, y 22-138), not on the 160 viewBox. -->
  <g transform="translate(37 112) scale(5)">
    <rect fill="#cbd5e1" x="24" y="34" width="46" height="12" rx="6"/>
    <rect fill="#cbd5e1" x="24" y="62" width="72" height="12" rx="6"/>
    <rect fill="#cbd5e1" x="24" y="90" width="58" height="12" rx="6"/>
    <rect fill="#cbd5e1" x="24" y="118" width="90" height="12" rx="6"/>
    <rect fill="#f59e0b" x="120" y="22" width="8" height="116" rx="4"/>
    <rect fill="#cbd5e1" opacity=".26" x="136" y="118" width="30" height="12" rx="6"/>
  </g>
</svg>
