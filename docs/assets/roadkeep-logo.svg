<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="roadkeep">
  <title>roadkeep</title>
  <desc>The roadkeep mark — task lines stopping at a gate — beside the wordmark.</desc>
  <style>
    .bar  { fill: #334155; }
    .gate { fill: #b45309; }
    .cut  { fill: #334155; opacity: .26; }
    .word { fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 60px; font-weight: 600; letter-spacing: -1.5px; }
    @media (prefers-color-scheme: dark) {
      .bar  { fill: #cbd5e1; }
      .gate { fill: #f59e0b; }
      .cut  { fill: #cbd5e1; opacity: .26; }
      .word { fill: #f1f5f9; }
    }
  </style>

  <rect class="bar" x="24" y="34"  width="46" height="12" rx="6"/>
  <rect class="bar" x="24" y="62"  width="72" height="12" rx="6"/>
  <rect class="bar" x="24" y="90"  width="58" height="12" rx="6"/>
  <rect class="bar" x="24" y="118" width="90" height="12" rx="6"/>
  <rect class="gate" x="120" y="22" width="8" height="116" rx="4"/>
  <rect class="cut" x="136" y="118" width="30" height="12" rx="6"/>

  <text class="word" x="196" y="101">roadkeep</text>
</svg>
