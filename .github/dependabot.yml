version: 2

# Moved here with the desktop reader (RK1697): Dependabot reads only the repository root's
# `.github/`, so the file gui/ carried as its own repository would have updated nothing.
# roadkeep itself declares no runtime dependencies; the npm trees are the four lockfiles below.
#
# One PR per group, not per package: `directories` makes each group span every tree, and a
# security update is grouped only by a group that says `applies-to: security-updates` — without
# one, every advisory opened its own PR in every tree that pinned the package.

updates:
  # gui/'s root manifest covers packages/core, packages/ui and packages/shell as workspaces.
  - package-ecosystem: npm
    directories:
      - /gui
      - /gui/site
      - /site
      - /site/docs
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      # A major lands alone in its group so a breaking bump never holds the safe ones back.
      npm-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The workflows at the root, gui/'s two among them: a pinned action goes stale the way a
  # pinned package does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
