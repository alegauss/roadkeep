# The reader's public site (gui/site/), moved here with the app (RK1697) — the build gate only.
#
# The gate runs on every push touching what the site reads: `npm run build` generates the
# product facts from gui/'s source, prerenders every route and asserts the route pairs, and
# `npm test` holds the output to the sources.
#
# The deploy it had in its own repository is not here. A repository publishes one GitHub Pages
# site, and this one's is roadkeep's own (site.yml); where the reader's site is served from now
# is RK1704's to decide.
name: gui-site

on:
  push:
    branches: [main]
    paths:
      [
        'gui/site/**',
        'gui/packages/core/src/**',
        'gui/packages/shell/src/**',
        'gui/package.json',
        'gui/electron-builder.yml',
        'gui/docs/ROADMAP.md',
        'gui/build/icon.svg',
        '.github/workflows/gui-site.yml',
      ]
  pull_request:
    paths:
      [
        'gui/site/**',
        'gui/packages/core/src/**',
        'gui/packages/shell/src/**',
        'gui/package.json',
        'gui/electron-builder.yml',
        'gui/docs/ROADMAP.md',
        'gui/build/icon.svg',
        '.github/workflows/gui-site.yml',
      ]

permissions:
  contents: read

concurrency:
  group: gui-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (the gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/site
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap's lastmod is the last commit that touched the authored site.
          fetch-depth: 0

      # The social card rasterises SVG text with resvg, which needs a font on disk.
      - name: fonts for the social card
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: gui/site/package-lock.json

      - name: build
        run: |
          npm ci
          npm run build

      - name: test
        run: npm test
