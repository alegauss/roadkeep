# The published site (site/ builds it, site/dist/ is what gets served), separate from the
# package.
#
# Two builds make one deploy. `site/` is the pitch, a Vite build whose copy lives in one module
# and whose every page is prerendered; `site/docs/` is the documentation area, an Astro project
# building into `site/dist/docs`. `npm run build` chains them in that order, because
# `vite build` empties `dist/` and an area built earlier is deleted by the step after it.
#
# `docs/` at the repository root is not in this at all any more: it is the governed store the
# four roles point at, and nothing serves it.
#
# **The gate and the deploy are two decisions.** The build runs on every push and pull request,
# so a page that stopped compiling is found by the person who pushed it rather than by a reader;
# the deploy waits to be asked, because a publish on every push is one nobody can hold still
# while reviewing it, and the site is the one artefact where a defect is public immediately.
#
# The deploy serves the bytes the gate already built and tested rather than building a second
# time: two builds of one commit are two answers about it, and the published one would be the
# untested.
#
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │ ONE-TIME REPOSITORY SETTING, without which the deploy is inert:                      │
# │   Settings → Pages → Build and deployment → Source: "GitHub Actions"                 │
# │ Left on "Deploy from a branch" this workflow goes green and publishes nothing — and  │
# │ the branch it would serve has no built site in it, because nothing commits one.      │
# │ The site is at alegauss.github.io/roadkeep/, which Pages derives from the repository │
# │ name rather than from anything in this file.                                         │
# └─────────────────────────────────────────────────────────────────────────────────────┘
name: site

on:
  push:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Least privilege by default. The Pages grants live on the job that publishes, so a push is
# never handed the token that can deploy.
permissions:
  contents: read

# A publish must not overlap another publish, and two gate runs on two branches have nothing to
# do with each other. Keying the group on the event is what keeps a push from cancelling a
# deploy that is halfway through.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages' || format('site-gate-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: build the site (the gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Two npm projects: the pitch, and the documentation area it builds into its dist/.
          cache-dependency-path: |
            site/package-lock.json
            site/docs/package-lock.json

      # The area's reference pages are generated from the tool's own parser (RK1402), so its
      # prebuild runs `roadkeep commands --json` before Astro sees anything. No install and no
      # dependencies: the package is read off `src/` the way every command in this repository
      # is, which is also what makes the answer this checkout's rather than a release's.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # `ci` and not `install`, for `publish.yml`'s reason about what was tested: a resolution
      # that drifts between this job and a developer's machine is a page nobody can reproduce.
      #
      # `npm run build` chains the area's build last, so both projects' dependencies have to be
      # on disk before it starts. The area is installed here rather than from inside that
      # script: an install inside a build is one that runs on every local rebuild too.
      - name: Build
        working-directory: site
        env:
          # A build machine is not a person Astro can ask.
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm --prefix docs ci
          npm run build

      # The site's own claims — the route pair, the twin per route, the sitemap, the social card
      # and the three joins to the area — asserted against what was just built. This is also
      # what makes the build's success mean something: it succeeds over an empty content
      # directory, and a green job over nothing published is the failure it would have.
      - name: Test
        working-directory: site
        run: npm test

      # Only what is about to be published is kept. On a push the build is the whole point and
      # the output is not wanted anywhere. The **whole dist** and not either half: the pitch and
      # the area are two halves of one site, and uploading one by itself publishes a deploy with
      # the other missing.
      - name: Keep the built site for the deploy
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
