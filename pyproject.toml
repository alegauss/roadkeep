# The package, as PyPI reads it (RK19). Distribution is what decides whether this is a
# standard or a script in one repository: `uvx roadkeep lint` has to run in a checkout of
# somebody else's project, with nothing installed and nothing to resolve.
#
# Two entries here are load-bearing rather than boilerplate:
#
#   * `dynamic = ["version"]` — the version is stated once, as `roadkeep.__version__`, and
#     the build reads it statically. A number written in two files is two files that can
#     disagree, which is the failure this whole tool is about, one layer down.
#   * `dependencies = []` — asserted in `tests/test_packaging.py` and not only in prose.
#     A tool meant to run in someone else's CI pays for every dependency it takes.

[build-system]
# 77 is the floor for PEP 639: `license` as an SPDX expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roadkeep"
description = "Owns the writes to a project's ROADMAP, CHANGELOG, IMPROVEMENTS and STRATEGY files, so the format is a schema at the point of insertion."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Oliveira" }]
keywords = [
    "roadmap",
    "changelog",
    "markdown",
    "backlog",
    "linter",
    "pre-commit",
    "agents",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/alegauss/roadkeep"
Repository = "https://github.com/alegauss/roadkeep"
Issues = "https://github.com/alegauss/roadkeep/issues"
Changelog = "https://github.com/alegauss/roadkeep/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
# `pytest-xdist` because `addopts` names `-n auto` (RK457): the flag is in the config, so a
# tree that installs the extra and cannot run the suite would be a contract this file states
# and does not keep. The runtime dependency count is still zero, which is the law — this is
# what the *suite* installs, not what `uvx roadkeep` imports.
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
roadkeep = "roadkeep.cli:main"

[tool.setuptools.dynamic]
# Read from the module's own literal, by AST and not by import: one number, one file.
version = { attr = "roadkeep.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# RK457. A full run was 2865 tests in 5m07s, paid before an edit is known to hold and paid
# again by an agent that edits, runs and edits. The time is not one hot spot — 272 s of 300
# is `call`, spread over a long tail of process spawns and filesystem work — which is what
# parallelism answers and a faster assertion does not. Measured here: 36-58 s over five
# consecutive green runs, against 60 s for the conservative `--dist loadfile`, so the
# default distribution stays the default.
#
# `auto` and not a number: this machine has 28 cores and CI has two, and a count written
# here would be wrong on one of them. `-n0` is the way back to a serial run, which is what
# a bisected flake wants. The zero-dependency law is about *runtime* (L2's neighbour): a
# tool run as `uvx roadkeep` in someone else's CI pays for what it imports, not for what
# its own suite installs — `pytest-xdist` is declared beside `pytest` in agents.md.
addopts = ["-n", "auto"]
