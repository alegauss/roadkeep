# roadkeep configures itself: this repository's docs are the tool's conformance
# fixture, so the file read here is the file every adopting project writes (RK18).

prefix = "RK"

# the pointer is the task id, derived on render: nothing to choose, nothing to
# renumber when a section is deleted
ref_scheme = "id"

# agents.md carries task ids too, and an id the scan misses is an id that gets reused.
id_sources = ["agents.md"]

# The queue moved into `## Priority` in docs/ROADMAP.md, where every queue verb reaches it
# (RK325) — the one tier of `pick` a project declares rather than derives. It is not declared
# here any more: the section wins wherever both exist, so a line left in this file would be an
# order read by nothing, which the gate reports as `priority.config`.

# where a defect in this tool is filed, for the `--issue` handoff (RK87). Configuration and
# not a constant, so a fork reports to itself — and nothing is ever sent from here: this
# only addresses the `gh` command a person runs after reading the capture.
[report]
upstream = "alegauss/roadkeep"

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
decisions = "docs/DECISIONS.md"
# no strategy: Turing has one, this project does not — absent, not empty

[limits]
# the P90 of the lines that already read well, which is an agent attention budget
# and not a style rule
symptom = 120
why = 200
line = 320

# a section is prose, so its budget is words: 250 clears the longest section here (181)
# and nothing more — the file that motivated this tool reached 539 KB one paragraph at a
# time. `prose` is the width a written section is filled to.
section = 250
prose = 88

# the roadmap's other bullet is governed here too (RK70) — declared, because Shio and Turing
# wrote their lists as prose years before the grammar existed. Measured on the five below:
# longest lead 43 characters, longest reason 152.
[non_goals]
lead = 60
why = 200

# The positive twin (RK1265), declared here because this repository's own `docs/` is the
# conformance fixture (RK1323): a table `init` now writes into every new project, and which
# the artefact that proves the format did not carry, is a table proven by tests alone. The
# limits are the list's own and are the same two numbers, measured on the same corpus.
[criteria]
lead = 60
why = 200

[tools]
# What one served tool may cost the session that connects the server (RK1059), which is
# RK30's argument about a resident file made about the schema. Per tool and not per list:
# a total is failed by whichever tool is added last and names nothing, where this is
# refused by the tool whose description somebody just edited. `budget --tools` ranks them
# and prints the room; the largest here is `ship` at 2,466, and the ceiling is set close
# enough that a description growing by a paragraph is a finding rather than a rounding.
# Raised from 2600 with the seventh subject on budget (RK1305), which overtook ship as
# the largest tool at 2,744. The property this ceiling was set for is the headroom above
# the largest, and it is tighter now than before: 56 characters, against 134 when ship
# led. So a description growing by a paragraph is still a finding, and nothing else was
# loosened to make room.
characters = 2800

# Re-taken as a number about this checkout (RK1364), which is what RK1360 made it:
# publication is per project now, so the reading here is 63,594 at 64 tools and the
# package's 66 is a total nothing is ever sent. The eight arguments this replaces
# measured three checkouts against each other to prove the surface was the package's,
# and that is the premise RK1360 removed - a project declaring every role pays for
# defer, resume and supersede on top, and one declaring three pays less than this one,
# so no single figure is both the widest project's bound and this project's. What
# refuses is what decides: lint runs in a checkout and refuses that checkout's surface.
# 63,700, headroom 106, which is the discipline of the last two raises (110 and 87) and
# not a looser one; from here a raise is argued in the commit that wrote it, where this
# verb says it belongs.
# Raised from 63,700 for a flag rather than a verb (RK1367): `govern --instead` is 167
# characters and re-words the description above it, so the reading here is 63,780. What
# the headroom buys is the one edit this file had no verb for - an argument whose
# premise was falsified came out by hand, which over MCP is no edit at all, so serving
# the stacking flag alone would have left an agent exactly where the defect was. Priced
# after the trim and not before it: that description was 622 and is 554, a tool over
# budget being a description nobody edited (RK1059). 63,900, headroom 120, which is the
# discipline of the 106 above it and not a looser one.
# Raised from 63,900 for a flag RK1369 found missing rather than one added: the claim
# tool is brief --claim and did not offer --have, where brief does and the argument for
# offering it is written directly above that line - so an agent taking a line could not
# say the machine has the thing, and the tool that starts a task set aside exactly the
# lines its read-only sibling would have offered. 242 characters, and the reading here
# is 64,022. Nothing was trimmed to pay for it: the description is one already written
# and shared with that sibling, so there is no paragraph nobody edited to cut. 64,150,
# headroom 128, which is the discipline of the 120 above it.
# Raised from 64,150 for a sentence rather than a verb (RK1393): the config description
# gained the second subject RK1381 added to that read - what this build fixes from its
# own corpus and no project declares - which is 103 characters, and the reading here is
# 64,184. What the headroom buys is a subject an agent could otherwise not discover: the
# skill and this description are the two surfaces a caller meets before calling, and a
# read answering a question neither names is a capability that exists for whoever
# already knew. Nothing was trimmed to pay for it - the description had no paragraph
# nobody had edited, which is the test RK1059 sets before a raise. 64,300, headroom 116,
# which is the discipline of the 120 above it.
# Raised from 64,300 for a verb rather than a flag (RK1453): revise is the correction
# door the decisions file had none of, and the reading here is 65,277. What the headroom
# buys is the only door there is - the sentence ship --decides files is written by an
# agent, and the alternative to serving it is the hand edit the guard denies that agent,
# which is how a typo came to outlive a decision. Nothing was trimmed to pay for it: no
# paragraph here is one nobody had edited, which is the test RK1059 sets before a raise.
# 65,400, headroom 123, which is the discipline of the 116 above it.
session = 65400

[budgets]
# Files loaded on every turn, and what each may cost (RK30). This budget lived in prose at
# the bottom of agents.md until the gate could hold it — which is exactly the arrangement
# that let Shio's reach 186 KB while declaring 150 lines about itself.
# bytes as well as lines, and close to the reading (120 lines, 7695 bytes once RK23 moved the
# write path out): a line budget alone is met by writing longer lines, and 20 KB of "under 150
# lines" is not a budget. Lowered when the skill took the rules — a budget left at the old
# figure is room the prose grows back into.
# What the room goes to, and the advice reversed by re-measuring it (RK203, RK1094). That
# figure was ~23% of the bytes and the conclusion was "compress the prose, not the index";
# `budget --file` reads the index at 36%, nearly three times the next section, because every
# task that adds a module adds an entry while the prose was compressed twice. So the index is
# the cheap cut, and it is the safe one: `tests/test_linting.py` holds it against
# `src/roadkeep/`, which says what may not be dropped. Re-read it before cutting, never
# re-derive it here — a percentage in a comment is what went stale the first time.
"agents.md" = { lines = 125, bytes = 8400 }
# The Claude Code entry point only points at agents.md, and a pointer that grew a second
# paragraph is a second place the rules live. Under `.claude/` because a root CLAUDE.md is a
# file the plugin payload publishes and the loader warns is not context (RK323).
".claude/CLAUDE.md" = { lines = 12, bytes = 800 }
# skills/roadkeep/SKILL.md is deliberately absent: it is trigger-loaded, so its cost falls on
# the turns that write, and budgeting it would price it as if it were resident (RK23). It has
# a ceiling all the same, held in tests/test_skill.py where this file's other shape facts are:
# it is an orientation now and the reference is two pages beside it (RK1437), so what that
# number holds is the cadence — a rule that grows belongs on a page.

[markers]
open = ["📋", "💭", "⏳", "🛠"]
# which of those still have their design to write (RK83). Declared rather than defaulted,
# because it is the one marker distinction `pick` acts on: `--designed` sets these aside for
# a caller executing a block, and every answer says when the line it chose is one of them.
undesigned = ["💭"]
shipped = "✅"
# the ledger's other door: a line that left without shipping (RK32). Never an open marker —
# a roadmap that can say "retired" is a roadmap holding work nobody will do.
retired = "🗑"

[claims]
# minutes a claim on a line reads as held, before a later caller steps over it (RK151). One
# task per commit here and the ledger's own commits say what that costs, so an hour is a
# working session and not a guess — the bound at 8h is what stops this becoming the lock an
# expiry exists not to be.
held = 60

[headings]
# the seven blocks are the shape of this backlog and outlive every line filed under them, so
# an emptied one is finished work and never a heading to withdraw (RK1121). Measured before
# declaring it: nine ships in one session offered `block drop` six times — D, B, F, B, C, E —
# and no block has ever been dropped here.
permanent = true

[reads]
# The widest brief here measures 2549 code units and costs 22.8 ms; 3300 is that plus
# the room two more done-when clauses take, and under it a brief stays cheaper to ask
# for than the lint that would find the overrun too late. Raise it against a fresh
# reading, never against a brief that grew.
brief = 3300

[limits.decisions]
# A design says how the work was built and a decision's body says what was weighed
# against it, which is the narrower thing: the alternatives rejected and the
# consequences accepted, and never that design moved here.
section = 150
